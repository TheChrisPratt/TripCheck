spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tripcheck_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: tripcheck_user
    password: tripcheck_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: 8081

app:
  cors:
    allowed-origins: "http://localhost:4200"
  webauthn:
    rp-id: "localhost"
    rp-name: "TripCheck"
    origin: "http://localhost:4200"
