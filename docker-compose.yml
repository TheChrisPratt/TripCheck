services:
  mysql:
    image: mysql:8.0
    container_name: tripcheck-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tripcheck_db
      MYSQL_USER: tripcheck_user
      MYSQL_PASSWORD: tripcheck_pass
#      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_ROOT_PASSWORD: den1se
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tripcheck_user", "-ptripcheck_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
